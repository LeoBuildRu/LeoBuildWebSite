{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BabylonJS Rotating Cube</title>
  <style>
    body {
        margin: 0;
    }
    canvas {
        width: 100%;
        height: 100%;
        touch-action: none;
    }
    .scroller-ziro::-webkit-scrollbar {
        width: 0;
    }
  </style>
</head>
<body class="scroller-ziro">

    <canvas id="renderCanvas"></canvas>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="{% static '/node_modules/babylonjs/babylon.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/earcut"></script>
    <script type="module" src="{% static '/js/builder.js' %}"></script>

</body>
</html>
