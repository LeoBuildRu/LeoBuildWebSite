{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BabylonJS Rotating Cube</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, html {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(150px);
    }
  </style>
</head>
<body class="">
  
  <div class="BackCircles w-full h-full fixed top-0 left-0 z-0"></div>

  <script>
    const container = document.querySelector('.BackCircles');
    const colors = ['#d4d5f7', '#ceebee', '#f7edde', '#e4e5f9'];
    const numberOfCircles = 50;

    function interpolateColor(color1, color2, factor) {
      const result = color1.slice();
      for (let i = 0; i < 3; i++) {
        result[i] = Math.round(result[i] + factor * (color2[i] - result[i]));
      }
      return `rgb(${result[0]}, ${result[1]}, ${result[2]})`;
    }

    function parseColor(color) {
      return color.match(/\w\w/g).map(hex => parseInt(hex, 16));
    }

    for (let i = 0; i < numberOfCircles; i++) {
      const circle = document.createElement('div');
      circle.classList.add('circle');
      container.appendChild(circle);

      let size = Math.random() * (400 - 150) + 150;
      let x, y;
      const onEdge = Math.random() < 0.3; // 30% шанс создать круг на границе

      if (onEdge) {
        const edge = Math.random();
        if (edge < 0.25) {
          x = -size * 0.75;
          y = Math.random() * window.innerHeight;
        } else if (edge < 0.5) {
          x = window.innerWidth - size * 0.25;
          y = Math.random() * window.innerHeight;
        } else if (edge < 0.75) {
          x = Math.random() * window.innerWidth;
          y = -size * 0.75;
        } else {
          x = Math.random() * window.innerWidth;
          y = window.innerHeight - size * 0.25;
        }
      } else {
        x = Math.random() * (window.innerWidth - size);
        y = Math.random() * (window.innerHeight - size);
      }

      let speedFactor = 0.01; // Это значение уменьшит скорость в 2 раза.
      let dx = ((Math.random() - 0.5) * 4) * speedFactor;
      let dy = ((Math.random() - 0.5) * 4) * speedFactor;
      let dSize = (Math.random() - 0.5) * 2;
      let colorIndex = Math.floor(Math.random() * colors.length);
      let nextColorIndex = (colorIndex + 1) % colors.length;
      let colorFactor = 0;

      circle.style.width = `${size}px`;
      circle.style.height = `${size}px`;
      circle.style.left = `${x}px`;
      circle.style.top = `${y}px`;

      function animate() {
        size += dSize;
        if (size < 150 || size > 400) dSize = -dSize;

        x += dx;
        y += dy;

        const maxOffset = size * 0.75;

        if (x < -maxOffset || x + size - maxOffset > window.innerWidth) dx = -dx;
        if (y < -maxOffset || y + size - maxOffset > window.innerHeight) dy = -dy;

        circle.style.width = `${size}px`;
        circle.style.height = `${size}px`;
        circle.style.left = `${x}px`;
        circle.style.top = `${y}px`;

        colorFactor += 0.01;
        if (colorFactor >= 1) {
          colorFactor = 0;
          colorIndex = nextColorIndex;
          nextColorIndex = (colorIndex + 1) % colors.length;
        }

        const currentColor = parseColor(colors[colorIndex]);
        const nextColor = parseColor(colors[nextColorIndex]);
        const interpolatedColor = interpolateColor(currentColor, nextColor, colorFactor);
        circle.style.backgroundColor = interpolatedColor;

        requestAnimationFrame(animate);
      }

      animate();
    }
  </script>
</body>
</html>
