{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BabylonJS Rotating Cube</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
        margin: 0;
    }
    canvas {
        width: 100%;
        height: 100%;
        touch-action: none;
    }
    .scroller-ziro::-webkit-scrollbar {
        width: 0;
    }
  </style>
</head>
<body class="scroller-ziro">
    <button class="absolute left-0 top-0 w-36 h-12 mt-16 ml-8 bg-white text-center" id="CreateWall">CREATE WALL</button>
    <button class="absolute left-0 top-0 w-36 h-12 mt-32 ml-8 bg-white text-center CreateCill" type="WindowMesh">CREATE WIN</button>
    <button class="absolute left-0 top-0 w-36 h-12 mt-48 ml-8 bg-white text-center CreateCill" type="DefoltMesh">CREATE DEF</button>
    <button class="absolute left-0 top-0 w-36 h-12 mt-64 ml-8 bg-white text-center" id="CreateFloor">CREATE FLOR</button>
    <canvas id="renderCanvas"></canvas>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.js"></script>
    <script type="module" src="{% static '/js/builder.js' %}"></script>

</body>
</html>
