    <title>Babylon.js и Tailwind CSS</title>
    <style>
        html, body {
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
        }
    
        canvas {
          display: block; /* Убирает пробелы между элементами */
          width: 100%;
          height: 100%;
          outline: 0;
        }

        .masked-overflow {
          /* scroll bar width, for use in mask calculations */
          --scrollbar-settings-width: 12px;

          /* mask fade distance, for use in mask calculations */
          --mask-height: 32px;

          /* If content exceeds height of container, overflow! */
          overflow-y: auto;

          /* Need to make sure container has bottom space,
        otherwise content at the bottom is always faded out */
          padding-bottom: var(--mask-height);

          /* Keep some space between content and scrollbar */
          padding-right: 12px;

          /* The CSS mask */

          /* The content mask is a linear gradient from top to bottom */
          --mask-image-content: linear-gradient(
              to bottom,
              transparent, /* Начинаем с прозрачного */
              black 0%,   /* Добавляем черный цвет на уровне 75% */
              black 75%,  /* Черный цвет продолжается до конца */
              transparent  /* Transparent на 100% */
          );

          /* Here we scale the content gradient to the width of the container 
        minus the scrollbar width. The height is the full container height */
          --mask-size-content: calc(100% - var(--scrollbar-settings-width)) 100%;

          /* The scrollbar mask is a black pixel */
          --mask-image-scrollbar: linear-gradient(black, black);

          /* The width of our black pixel is the width of the scrollbar.
        The height is the full container height */
          --mask-size-scrollbar: var(--scrollbar-settings-width) 100%;

          /* Apply the mask image and mask size variables */
          mask-image: var(--mask-image-content), var(--mask-image-scrollbar);
          mask-size: var(--mask-size-content), var(--mask-size-scrollbar);

          /* Position the content gradient in the top left, and the 
        scroll gradient in the top right */
          mask-position: 0 0, 100% 0;

          /* We don't repeat our mask images */
          mask-repeat: no-repeat, no-repeat;
        }


        .custom-scroll::-webkit-scrollbar {
            width: 12px; /* Ширина скроллбара */
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.7); /* Фон полосы скролла */
            border-radius: 12px; /* Закругленные углы полосы */
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            width: 12px;
            background-color: rgba(0, 0, 0, 0.2);; /* Темно-серый цвет для ползунка */
            border-radius: 12px; /* Закругленные углы для ползунка */
            border: 2px solid rgba(255, 255, 255, 1);;
        }

        /* Убираем стрелки */
        .custom-scroll::-webkit-scrollbar-button {
            display: none; /* Скрыть стрелки */
        }

        input[type=range][orient=vertical] {
            writing-mode: vertical-lr;
            direction: rtl;
            appearance: slider-vertical;
            width: 16px;
            vertical-align: bottom;
        }
    </style>
</head>
