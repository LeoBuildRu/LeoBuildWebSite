{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BabylonJS Rotating Cube</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block; /* Убирает пробелы между элементами */
      width: 100%;
      height: 100%;
      outline: 0;
    }
  </style>
</head>
<body class="">
    <button class="absolute right-0 top-0 w-36 h-12 mt-16 mr-8 bg-white text-center" id="CreateWall">CREATE WALL</button>
    <button class="absolute right-0 top-0 w-36 h-12 mt-32 mr-8 bg-white text-center CreateCill" type="WindowMesh">CREATE WIN</button>
    <button class="absolute right-0 top-0 w-36 h-12 mt-48 mr-8 bg-white text-center CreateCill" type="DefoltMesh">CREATE DEF</button>
    <button class="absolute right-0 top-0 w-36 h-12 mt-64 mr-8 bg-white text-center" id="CreateFloor">CREATE FLOR</button>
    <button class="absolute right-0 top-0 w-36 h-12 mt-80 mr-8 bg-white text-center" id="ChageTo2D">2D CAMERA</button>
    <button class="absolute right-0 top-0 w-36 h-12 mt-96 mr-8 bg-white text-center" id="ChageTo3D">3D CAMERA</button>
    <canvas id="renderCanvas"></canvas>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="{% static 'node_modules/babylonjs/babylon.js' %}"></script>
    <script src="{% static 'node_modules/babylonjs-loaders/babylonjs.loaders.js' %}"></script>
    <script src="https://cdn.babylonjs.com/earcut.min.js"></script>
    <script type="module" src="{% static '/js/builder.js' %}"></script>

</body>
</html>
